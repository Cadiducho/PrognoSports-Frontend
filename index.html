<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
        <link rel="manifest" href="/site.webmanifest">
        <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#693ba7">
        <meta name="msapplication-TileColor" content="#00aba9">
        <meta name="theme-color" content="#ffffff">
        <link rel="icon" href="/favicon.ico">
        <link rel="manifest" href="/manifest.json">
        <title>PrognoSports</title>
        <script>
            // Aplica el tema antes de pintar para evitar el destello claro (ver themeStore.ts)
            (function () {
                try {
                    var theme = localStorage.getItem('theme');
                    if (!theme) {
                        var legacy = localStorage.getItem('dark');
                        theme = legacy === 'true' ? 'dark' : legacy === 'false' ? 'light' : 'system';
                    }
                    var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                    document.documentElement.classList.toggle('dark', dark);
                    document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
                } catch (e) {}
            })();
        </script>
    </head>
    <body>
        <noscript>
            <strong>We're sorry but Prognosports doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
        </noscript>

        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
