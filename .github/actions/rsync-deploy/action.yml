name: Rsync deploy
description: Sube el contenido de un directorio local a un servidor mediante rsync sobre SSH.

inputs:
  host:
    description: Host del servidor SSH.
    required: true
  username:
    description: Usuario SSH.
    required: true
  key:
    description: Clave privada SSH.
    required: true
  port:
    description: Puerto SSH.
    required: false
    default: '22'
  source:
    description: Directorio local cuyo contenido se sube.
    required: true
  target:
    description: Directorio remoto de destino.
    required: true

runs:
  using: composite
  steps:
    - name: Rsync over SSH
      shell: bash
      env:
        SSH_HOST: ${{ inputs.host }}
        SSH_USER: ${{ inputs.username }}
        SSH_KEY: ${{ inputs.key }}
        SSH_PORT: ${{ inputs.port }}
        SOURCE: ${{ inputs.source }}
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        umask 077
        ssh_dir="$(mktemp -d "$RUNNER_TEMP/rsync-deploy.XXXXXX")"
        trap 'rm -rf "$ssh_dir"' EXIT

        printf '%s\n' "$SSH_KEY" > "$ssh_dir/key"
        ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > "$ssh_dir/known_hosts" 2>/dev/null

        ssh_cmd="ssh -i $ssh_dir/key -p $SSH_PORT -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes"
        args=(--recursive --links --times --omit-dir-times --compress --itemize-changes)

        # La barra final del origen copia su contenido, no el directorio en sí
        rsync "${args[@]}" -e "$ssh_cmd" "${SOURCE%/}/" "$SSH_USER@$SSH_HOST:${TARGET%/}/"
