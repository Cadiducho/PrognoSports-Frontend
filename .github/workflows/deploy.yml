name: Deploy to Production

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/vite.yml
    with:
      build_command: 'build'
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://prognosports.com
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend
          path: ./dist
      - name: Upload to server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SECRET_FRONTEND_HOST }}
          username: ${{ secrets.SECRET_FRONTEND_USER }}
          key: ${{ secrets.SECRET_FRONTEND_RSA }}
          port: ${{ secrets.SECRET_FRONTEND_PORT }}
          source: "dist/"
          target: ${{ secrets.SECRET_FRONTEND_PATH }}
          strip_components: 1
