name: Deploy to Beta

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-beta
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: $/.github/workflows/vite.yml
    with:
      build_command: 'buildBeta'
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: beta
      url: https://beta.prognosports.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend
          path: ./dist
      - name: Upload to server
        uses: ./.github/actions/rsync-deploy
        with:
          host: ${{ secrets.SECRET_FRONTEND_HOST }}
          username: ${{ secrets.SECRET_FRONTEND_USER }}
          key: ${{ secrets.SECRET_FRONTEND_RSA }}
          port: ${{ secrets.SECRET_FRONTEND_PORT }}
          source: dist/
          target: ${{ secrets.SECRET_FRONTEND_BETA_PATH }}
